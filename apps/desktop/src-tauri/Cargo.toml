[package]
name = "allmytools-desktop"
version = "0.1.0"
description = "AllMyTools 桌面应用"
authors = ["AllMyTools"]
edition = "2021"

[lib]
name = "allmytools_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "allmytools-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.5.1", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3.0"
tauri-plugin-window-state = "2.4.0"
